# Internal-server deployment. Put SQL_USERNAME / SQL_PASSWORD in a .env file
# next to this file (see backend/.env.example), then:  docker compose up -d --build
# Access on the AA network:  http://<server-ip>:9400/rca_console.html
services:
  rca:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9400:9400"
    environment:
      SQL_SERVER: "10.10.9.75"
      SQL_DATABASE: "Playground"
      SQL_TABLE: "dbo.Input_To_ML"
      SQL_AUTH: "sql"
      SQL_USERNAME: "${SQL_USERNAME}"
      SQL_PASSWORD: "${SQL_PASSWORD}"
      SQL_DRIVER: "ODBC Driver 18 for SQL Server"
      SQL_ENCRYPT: "false"
      SQL_TRUST_CERT: "true"
      # LLM Investigation Engine — leave blank to keep the honest placeholder response.
      # Priority (primary/secondary) is set in backend/config.json, not by the order here.
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
    restart: unless-stopped
